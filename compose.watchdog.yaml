# Run on another host, independent of the StackWatch server.
services:
  watchdog:
    build: .
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["node", "watchdog.mjs"]
    env_file: .env.watchdog
    environment:
      WATCHDOG_DATA_DIR: /app/watchdog-data
    volumes:
      - watchdog-data:/app/watchdog-data
    healthcheck:
      disable: true
volumes:
  watchdog-data:
